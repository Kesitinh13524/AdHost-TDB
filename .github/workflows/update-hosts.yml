name: Update NextDNS blocklist

on:
  schedule:
    - cron: "17 19 * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/**"
      - "tests/**"
      - "sources.json"
      - "allowlist.txt"
      - ".github/workflows/update-hosts.yml"

permissions:
  contents: write

concurrency:
  group: update-nextdns-blocklist
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test parser
        run: python -m unittest discover -s tests -v
      - name: Generate NextDNS-compatible domain list
        run: python scripts/update_hosts.py
      - name: Commit changed list
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Generated host-list files are unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: refresh NextDNS blocklist"
          git push
