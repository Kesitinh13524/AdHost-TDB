name: Update NextDNS blocklist

on:
  schedule:
    - cron: "17 19 * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/**"
      - "tests/**"
      - "sources.json"
      - "allowlist.txt"
      - ".github/workflows/update-hosts.yml"

permissions:
  contents: write

concurrency:
  group: update-nextdns-blocklist
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test parser
        run: python -m unittest discover -s tests -v
      - name: Generate single NextDNS-compatible domain list
        env:
          HOSTS_RELEASE_OUTPUT: ${{ runner.temp }}/hosts.txt
        run: python scripts/update_hosts.py
      - name: Publish the single large-file release asset
        env:
          GH_TOKEN: \${{ github.token }}
          ASSET_PATH: \${{ runner.temp }}/hosts.txt
        run: |
          new_digest=$(sha256sum "$ASSET_PATH" | cut -d ' ' -f 1)
          current_digest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.assets[] | select(.name == "hosts.txt") | .digest // empty' 2>/dev/null || true)
          current_digest="\${current_digest#sha256:}"
          if [ "$new_digest" = "$current_digest" ]; then
            echo "Release asset is unchanged."
            exit 0
          fi

          tag="hosts-\${GITHUB_RUN_ID}-\${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" "$ASSET_PATH" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Latest deduplicated host list" \
            --notes "Automatically refreshed from configured host feeds. Stable URL: https://github.com/$GITHUB_REPOSITORY/releases/latest/download/hosts.txt" \
            --target "$GITHUB_SHA" \
            --latest

          while IFS= read -r old_tag; do
            if [ -n "$old_tag" ] && [ "$old_tag" != "$tag" ]; then
              gh release delete "$old_tag" --cleanup-tag --yes --repo "$GITHUB_REPOSITORY"
            fi
          done < <(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '.[] | select(.tagName | startswith("hosts-")) | .tagName')
